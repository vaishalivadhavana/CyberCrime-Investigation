<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session 1: Introduction to Cybercrime Investigation</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d2433;--mut:#5d667a;--acc:#0b5fff;--ok:#0a7d4b;--bad:#c0392b;--line:#dcdad2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a212d;--ink:#e8ecf4;--mut:#9aa5ba;--acc:#6aa0ff;--ok:#3fc78a;--bad:#ff7a6b;--line:#2c3547}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a212d;--ink:#e8ecf4;--mut:#9aa5ba;--acc:#6aa0ff;--ok:#3fc78a;--bad:#ff7a6b;--line:#2c3547}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header b{font-size:14px}header span{color:var(--mut);font-size:13px}
#bar{height:3px;background:var(--acc);width:0;transition:width .3s}
main{max-width:760px;margin:0 auto;padding:22px 18px 90px}
.tag{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:30px;line-height:1.15;margin:6px 0 10px}h2{font-size:24px;margin:6px 0 12px}h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 12px}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}
.opt:hover,.on{border-color:var(--acc)}.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.box{background:color-mix(in srgb,var(--acc) 9%,var(--card));border-left:4px solid var(--acc);padding:10px 14px;border-radius:8px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.big{font-size:28px;font-weight:700;color:var(--acc)}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
nav button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600}nav button:disabled{opacity:.35}
.sm{font-size:14px}
</style></head><body>
<header><b>Session 1 · Cybercrime Investigation</b><span id="pg"></span></header><div id="bar"></div>
<main id="m"></main>
<nav><button id="pv">← Previous</button><span class="mut sm" id="ttl"></span><button id="nx">Next →</button></nav>
<script>
const $=s=>document.querySelector(s);
const reveal=(items,id)=>`<div class="row" id="${id}">${items.map((x,i)=>`<button class="chip" data-i="${i}">${x[0]}</button>`).join('')}</div><div class="card" id="${id}o"><span class="mut">Tap an item above.</span></div>`;
const wire=(id,items)=>{document.querySelectorAll('#'+id+' .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');$('#'+id+'o').innerHTML=items[b.dataset.i][1]})};
const ERAS=[["1980s–90s: Curiosity","Hackers explore networks; first worms and viruses (Morris worm, 1988). Motive: fame and experiment. Harm: mostly disruption. Few laws existed."],
["2000s: Mass spread & law","Email worms such as ILOVEYOU (2000) spread worldwide. India enacted the IT Act, 2000. Phishing and online banking fraud begin; motive shifts to money."],
["2010s: Organised crime","Ransomware, banking trojans, dark-web markets, cryptocurrency payments. WannaCry (2017) hit hospitals and firms in 150+ countries. Smartphones and UPI widen the target base."],
["2020s: Scams at scale","Social engineering dominates: digital arrest, investment and task scams, sextortion, deepfake and AI-voice fraud. Crime-as-a-service lowers the skill needed. Cross-border scam compounds run industrially."]];
const TYPES=[["Phishing / vishing / smishing","Fake bank SMS, call or link that steals credentials or OTP."],["Financial fraud","UPI fraud, card cloning, investment and loan-app scams, mule accounts."],["Ransomware / malware","Data encrypted or stolen; payment demanded in crypto."],["Identity theft & SIM swap","Victim's identity or number taken over to reach bank accounts."],["Cyberstalking, sextortion, morphing","Harassment and blackmail, often targeting women and teenagers."],["Cyber-enabled & cyber-dependent","Dependent: only possible online (hacking, DDoS). Enabled: old crime made bigger by tech (fraud, trafficking)."]];
const SC=[["A caller in 'CBI uniform' on video call says you are under digital arrest and must transfer money for 'verification'.","Social-engineering fraud (digital arrest)"],["A hospital's files are encrypted and 0.5 BTC is demanded.","Ransomware"],["A woman's edited photos are sent to her with a payment demand.","Sextortion / morphing"],["An employee's mobile suddenly loses signal; minutes later his account is emptied.","SIM swap"]];
const ROLES=[["Recruiter / scammer","Runs the call centre or Telegram group; finds victims using leaked data and scripts."],["Tool & data supplier","Sells phishing kits, malware, leaked databases, spoofed numbers. Crime-as-a-service."],["Mule account holder","Lends or rents a bank account for a fee. Often the only person the police can reach first. Trace upward."],["Cash-out & layering","Money split across many accounts, moved to wallets, crypto, ATMs or hawala within minutes."],["Infrastructure","SIM cards, VPN, hosting, fake apps and domains, often abroad."]];
const CH=[["Volatile evidence","Logs, chats and cloud data are overwritten. Send preservation requests to platforms early."],["Jurisdiction","Victim in Kohima, accused in another state or country, servers elsewhere. MLAT is slow; use the 1930 / NCRP network and nodal officers."],["Anonymity","VPN, burner SIMs, fake KYC, crypto mixers. Look for human mistakes: device IDs, IP leaks, reused numbers."],["Speed","Money leaves in minutes. Delay in the first hour is the biggest loss."],["Capacity & awareness","Evidence handling, tools and training gaps; victims reluctant to report."],["Legal & proof","Admissibility of electronic evidence, hash values, chain of custody. Covered in the next session."]];
const FH=["Note exact time of fraud, amount, UTR/transaction IDs, account numbers","Ask the victim to call 1930 / file at cybercrime.gov.in at once so the bank can freeze funds","Request the bank (nodal officer) to hold the credited amount in beneficiary accounts","Screenshot and save chats, call logs, numbers, links, app names; do not let the victim delete anything","Do not open or reset the victim's phone; keep it in airplane mode if it must be seized","Send preservation notice to platform (WhatsApp, Telegram, Meta, Google) and telecom operator","Register FIR or NCRP complaint; record accounts as a trail, not a final suspect list"];
const QZ=[["Why is the first hour so important in a UPI fraud?","Funds can still be frozen before they are cashed out","The victim forgets details","The FIR deadline ends","a"],["The person who rented out his bank account is usually…","The mastermind","A mule, a link in the chain to trace upward","A fully innocent person always","b"],["Ransomware is best described as…","Cyber-dependent crime","Only a state crime","Cyber-enabled traditional crime","a"]];
const S=[
()=>`<div class="tag">Session 1 · 90 minutes</div><h1>Introduction to Cybercrime Investigation</h1><p class="mut">Evolution, types, ecosystem and the challenges of investigation, built around real cases and a first-hour checklist.</p>
<div class="grid"><div class="card"><h3>1 · Evolution</h3><span class="mut sm">20 min</span></div><div class="card"><h3>2 · Types</h3><span class="mut sm">20 min</span></div><div class="card"><h3>3 · Ecosystem</h3><span class="mut sm">20 min</span></div><div class="card"><h3>4 · Case: digital arrest</h3><span class="mut sm">10 min</span></div><div class="card"><h3>5 · Challenges + checklist</h3><span class="mut sm">15 min</span></div><div class="card"><h3>6 · Quiz</h3><span class="mut sm">5 min</span></div></div>
<p class="sm mut">Move with ← → keys or the buttons below.</p>`,
()=>`<div class="tag">Part 1</div><h2>How cybercrime evolved</h2><p>Tap each era. Notice how motive moves from fame to money to industrial scale.</p>${reveal(ERAS,'er')}<div class="box"><b>Thread to remember:</b> technology changes, the criminal's goal (money, power, revenge) does not.</div>`,
()=>`<div class="tag">Part 2</div><h2>Types of cybercrime</h2>${reveal(TYPES,'ty')}<h3 style="margin-top:18px">Name the crime</h3><div id="sc"></div>`,
()=>`<div class="tag">Part 3</div><h2>The cybercrime ecosystem</h2><p>Few crimes are committed by one person. Tap each role in the chain.</p>${reveal(ROLES,'ec')}<div class="box"><b>Investigator's rule:</b> follow the money and the infrastructure, not just the caller.</div>`,
()=>`<div class="tag">Case study</div><h2>Digital arrest scam</h2><p>Tap to step through a typical case. <span class="mut">Illustrative pattern, not a single named case.</span></p><div id="cs" class="card"></div><button class="opt" id="cn">Show next step</button><div class="box"><b>Fact:</b> there is no “digital arrest” in Indian law. Police and agencies never demand money over a video call.</div>`,
()=>`<div class="tag">Part 4</div><h2>Challenges in investigation</h2>${reveal(CH,'ch')}`,
()=>`<div class="tag">Practical</div><h2>The first-hour checklist</h2><p>Tick as you walk through a UPI-fraud complaint.</p><div id="fh"></div><p class="sm mut" id="fc"></p>`,
()=>`<div class="tag">Wrap-up</div><h2>Exit quiz</h2><div id="qz"></div><div class="box"><b>Takeaways:</b> crime has evolved in tools, not motive · ecosystem has many links · speed saves money · preserve evidence before anything else.</div><p class="sm mut">Next session: IT Act, BNS, digital evidence and jurisdiction.</p>`];
const INIT=[()=>{},()=>wire('er',ERAS),()=>{wire('ty',TYPES);let h='';SC.forEach((s,i)=>{const o=[...new Set(SC.map(x=>x[1]))];h+=`<div class="card" style="margin:8px 0"><p class="sm">${s[0]}</p>${o.map(t=>`<button class="opt sm" data-i="${i}" data-t="${t}">${t}</button>`).join('')}</div>`});$('#sc').innerHTML=h;document.querySelectorAll('#sc .opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.t==SC[b.dataset.i][1];b.classList.add(ok?'good':'wrong')})},()=>wire('ec',ROLES),()=>{const st=["Victim gets a call: 'a parcel in your name has drugs / your Aadhaar is misused'.","Call is transferred to a fake CBI / police officer on video, with a staged office background.","Victim is told not to tell anyone and to stay on camera: 'digital arrest'.","Victim is told to move savings to a 'safe RBI account' for verification.","Money lands in mule accounts, splits within minutes, goes to wallets or crypto.","Victim realises, calls 1930. Fast reporting can still freeze part of the money."];let i=0;const sh=()=>{$('#cs').innerHTML=st.slice(0,i+1).map((s,k)=>`<p><b>${k+1}.</b> ${s}</p>`).join('');if(i>=st.length-1)$('#cn').style.display='none'};sh();$('#cn').onclick=()=>{i++;sh()}},()=>wire('ch',CH),()=>{$('#fh').innerHTML=FH.map((t,i)=>`<label class="ck"><input type="checkbox" data-i="${i}"><span>${t}</span></label>`).join('');const u=()=>{const n=document.querySelectorAll('#fh input:checked').length;$('#fc').textContent=n+' of '+FH.length+' done'};document.querySelectorAll('#fh input').forEach(c=>c.onchange=u);u()},()=>{$('#qz').innerHTML=QZ.map((q,i)=>`<div class="card" style="margin:8px 0"><b>${i+1}. ${q[0]}</b>${['a','b','c'].slice(0,3).map((k,j)=>q[j+1]&&j<3?`<button class="opt" data-q="${i}" data-k="${k}">${q[j+1]}</button>`:'').join('')}</div>`).join('');document.querySelectorAll('#qz .opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.k==QZ[b.dataset.q][4];b.classList.add(ok?'good':'wrong')})}];
let p=0;
function go(n){p=Math.max(0,Math.min(S.length-1,n));$('#m').innerHTML=S[p]();INIT[p]();$('#pg').textContent=(p+1)+' / '+S.length;$('#bar').style.width=((p+1)/S.length*100)+'%';$('#pv').disabled=p==0;$('#nx').disabled=p==S.length-1;scrollTo(0,0);try{history.replaceState(null,'','#'+(p+1))}catch(e){}}
$('#pv').onclick=()=>go(p-1);$('#nx').onclick=()=>go(p+1);
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(p+1);if(e.key=='ArrowLeft')go(p-1)});
go((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
